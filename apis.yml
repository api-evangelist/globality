name: Globality
description: 'Globality is an AI-driven enterprise sourcing and procurement platform that helps large
  organizations run sourcing events, manage tail spend, and reduce costs through automated, guided
  workflows and an AI advisor. The platform integrates with enterprise systems such as SAP Ariba,
  SAP Fieldglass, and Coupa via prebuilt connectors, and exposes a developer API and webhooks so
  customers can sync sourcing, contract, and spend data into their own systems and middleware.
  Backed by the SoftBank Vision Fund, Globality serves global enterprises across sectors and holds
  ISO/IEC 27001:2022 certification along with SOC 2 and GDPR compliance.'
